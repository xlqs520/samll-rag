

logging:
  level:
    # 将此处的包名换成你项目里真实的 Mapper 接口包路径
    com.xlqs.smallrag.mapper: DEBUG

spring:
  ai:
    openai:
      base-url: http://localhost:11434        # 指向本地 Ollama 的 OpenAI 兼容接口
      api-key: ollama                          # Ollama 不需要真实 Key，但框架要求非空，随便填一个即可
      embedding:
        options:
          model: quentinz/bge-large-zh-v1.5:q8_0 # 你本地的 bge 模型名称
#        base-url: https://ark.cn-beijing.volces.com/api/coding/v3        # 指向本地 Ollama 的 OpenAI 兼容接口
#        api-key:                          # Ollama 不需要真实 Key，但框架要求非空，随便填一个即可
#        embedding:
#          options:
#            model: doubao-embedding-vision
#          embeddings-path: /embeddings
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: default_collection # 会根据我们在业务中动态切换
        initialize-schema: true
        api-key: Xlqsnhyq521..

  datasource:
    url: jdbc:mysql://localhost:3306/small-rag?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  data:
    redis:
      database: 1
      host: 127.0.0.1         # Redis 服务器地址
      port: 6379              # Redis 端口
      password: Xlqsnhyq521..              # Redis 密码（如果没有则不填）
      timeout: 10s            # 连接超时时间
      lettuce:
        pool:
          max-active: 200     # 连接池最大连接数
          max-idle: 10        # 连接池中的最大空闲连接
          min-idle: 0         # 连接池中的最小空闲连接
          max-wait: -1ms      # 连接池最大阻塞等待时间

sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true         # Token 名称（同时也是 Cookie 名称、Redis Key 前缀）


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations:
    - classpath*:com/**/*.xml


minio:
  endpoint: http://localhost:9000
  access-key: xlqs
  secret-key: Xlqsnhyq521..
  bucket: small-rag


server:
  port: 8081
  servlet:
    context-path: /rag